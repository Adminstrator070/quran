<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حول المطور — Mohamed Ahmed</title>
<style>
:root{--bg:#0d0e17;--paper:#121321;--ink:#f1edff;--muted:#aaa3c8;--line:#29263e;--accent:#a78bfa;--radius:22px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at 50% 35%,#17152b 0%,#0d0e17 58%);color:var(--ink);font-family:sans-serif;line-height:1.7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.container{width:min(700px,100%);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:40px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.header{text-align:center;margin-bottom:30px}
.header h1{font-size:28px;margin-bottom:10px;color:var(--accent)}
.header p{color:var(--muted);font-size:14px}
.content{font-size:15px;color:var(--muted);margin-bottom:30px;line-height:1.9}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:30px}
.feature-box{background:rgba(167,139,250,.05);border:1px solid var(--line);border-radius:14px;padding:15px;text-align:center}
.feature-box span{display:block;font-size:13px;color:var(--ink);font-weight:700;margin-top:5px}
.actions{text-align:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;background:var(--accent);color:#100d1c;font-weight:700;text-decoration:none}
@media(max-width:600px){.features{grid-template-columns:1fr}.container{padding:20px}}
</style>
</head>
<body>
<div class="container">
 <div class="header">
  <h1>صفحة المطور — Mohamed Ahmed</h1>
  <p>تطبيق يعمل محلياً بالكامل (Offline First Mode)</p>
 </div>
 <div class="content">
  <p>تم بناء وتطوير تطبيق "مشكاة" خصيصاً ليعمل بدون الحاجة لأي اتصال بالإنترنت، مع التركيز على السرعة الفائقة والخصوصية التامة للمستخدم.</p>
 </div>
 <div class="features">
  <div class="feature-box">⚡ <span>سرعة استجابة</span></div>
  <div class="feature-box">🛡️ <span>خصوصية متميزة</span></div>
  <div class="feature-box">📶 <span>أوفلاين بالكامل</span></div>
 </div>
 <div class="actions">
  <a href="index.html" class="btn">العودة للتطبيق</a>
 </div>
</div>
</body>
</html>
