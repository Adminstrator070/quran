<title>مشكاة</title>
<script>
(function(){var shown=false;
function show(msg){if(shown||window.__ok)return;shown=true;var sp=document.getElementById('splash');if(sp)sp.style.display='none';
 var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:#0c1512;color:#e9f0ec;padding:24px;overflow:auto;font:15px/1.8 sans-serif;direction:rtl';
 d.innerHTML='<h2 style="margin:0 0 8px;color:#e0b64a">تعذّر تشغيل مشكاة</h2><p>حدث خطأ أثناء فتح التطبيق. جرّب إعادة المحاولة، وإن تكرّر أرسل التفاصيل التالية للمطوّر.</p><pre id="dg" style="direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all;background:#15231e;padding:12px;border-radius:12px;font-size:12px"></pre><p><button id="d1" style="padding:12px 20px;border:0;border-radius:12px;background:#3fb184;color:#06150f;font-size:16px">إعادة المحاولة</button></p><p><button id="d2" style="padding:12px 20px;border:1px solid #3fb184;border-radius:12px;background:none;color:#3fb184;font-size:16px">مسح بيانات التطبيق وإعادة المحاولة</button></p>';
 (document.body||document.documentElement).appendChild(d);
 d.querySelector('#dg').textContent=msg+'\n\n'+navigator.userAgent;
 d.querySelector('#d1').onclick=function(){location.reload()};
 d.querySelector('#d2').onclick=function(){try{localStorage.clear()}catch(e){}try{caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}).then(function(){location.reload()},function(){location.reload()})}catch(e){location.reload()}}}
window.addEventListener('error',function(e){var m=(e.message||'error')+(e.filename?' @ '+String(e.filename).split('/').pop()+':'+e.lineno:'');
 if(e.target&&e.target.tagName==='SCRIPT'){show('script failed to load: '+(e.target.src||''))}else window.__err=window.__err||m},true);
window.addEventListener('unhandledrejection',function(e){window.__err=window.__err||String(e.reason&&e.reason.stack||e.reason)});
setTimeout(function(){if(!window.__ok)show(window.__err||'startup timeout')},8000);
})();
</script>
